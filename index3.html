```
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .container {
        max-width: 800px;
        width: 100%;
    }

    .header {
        text-align: center;
        color: white;
        margin-bottom: 50px;
    }

    .header h1 {
        font-size: 2.5rem;
        margin-bottom: 15px;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    .header p {
        font-size: 1.1rem;
        opacity: 0.95;
    }

    .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 30px;
        margin-bottom: 40px;
    }

    .card {
        background: white;
        border-radius: 15px;
        padding: 40px 30px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        text-decoration: none;
        color: inherit;
        display: block;
    }

    .card:hover {
        transform: translateY(-10px);
        box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    }

    .card-icon {
        font-size: 3rem;
        margin-bottom: 20px;
    }

    .card h2 {
        font-size: 1.6rem;
        color: #333;
        margin-bottom: 15px;
    }

    .card p {
        color: #666;
        line-height: 1.6;
        font-size: 0.95rem;
    }

    .card-tech {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
    }

    .card-tech h2,
    .card-tech p {
        color: white;
    }

    .card-settle {
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        color: white;
    }

    .card-settle h2,
    .card-settle p {
        color: white;
    }

    .footer {
        text-align: center;
        color: white;
        font-size: 0.9rem;
        opacity: 0.8;
    }

    @media (max-width: 768px) {
        .header h1 {
            font-size: 2rem;
        }
        
        .cards {
            grid-template-columns: 1fr;
        }
    }
</style>
